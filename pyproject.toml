[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "deltaprompt-cli"
version = "0.1.0"
description = "Delta CLI (dp): baseline + delta prompting with multi-provider async execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Delta" }]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<14.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dp = "dp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dp"]

[tool.hatch.build.targets.sdist]
include = [
  "dp",
  "pyproject.toml",
  "README.md",
]
